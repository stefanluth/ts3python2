name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.dev.txt

      - name: Run ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run ty
        run: ty check --output-format=github .

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.dev.txt

      - name: Run unit tests
        run: pytest -m "not integration" -q --durations=10

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit
    env:
      TS3_TEST_CONTAINER: ts3-test-${{ github.run_id }}-${{ github.run_attempt }}
      TS3_INTEGRATION: "1"
      TS3_QUERY_HOST: "127.0.0.1"
      TS3_QUERY_PORT: "10022"
      TS3_SERVER_PORT: "9987"
      QUERY_ADMIN_PASSWORD: "IntegrationAdmin123"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.dev.txt

      - name: Run TeamSpeak 3 Docker Container
        run: |
          docker run -p 127.0.0.1:10022:10022 -p 9987:9987/udp -p 30033:30033 \
            -e TS3SERVER_LICENSE=accept \
            -e TS3SERVER_QUERY_PROTOCOLS=ssh \
            -e TS3SERVER_QUERY_SSH_PORT=10022 \
            -e TS3SERVER_SERVERADMIN_PASSWORD=IntegrationAdmin123 \
            --name "${TS3_TEST_CONTAINER}" -d teamspeak:3.13.9

      - name: Wait for TS3 query port
        run: |
          for attempt in {1..60}; do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/10022' 2>/dev/null; then
              echo "TS3 query port is ready"
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' "${TS3_TEST_CONTAINER}" | grep -q true; then
              echo "TS3 container exited before the query port became ready" >&2
              docker logs "${TS3_TEST_CONTAINER}" >&2 || true
              exit 1
            fi
            sleep 1
          done
          echo "Timed out waiting for the TS3 query port" >&2
          docker logs --tail 200 "${TS3_TEST_CONTAINER}" >&2 || true
          exit 1

      - name: Run integration tests
        run: pytest -m integration -v --durations=10

      - name: Collect server logs
        if: failure()
        run: |
          docker logs --tail 500 "${TS3_TEST_CONTAINER}" > ts3-server.log 2>&1 || true
          if [ -f logs/main.log ]; then tail -n 500 logs/main.log > main.log.tail; fi
          if [ -f logs/plugins.log ]; then tail -n 500 logs/plugins.log > plugins.log.tail; fi

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-logs
          path: |
            ts3-server.log
            *.log.tail
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up
        if: always()
        run: docker rm -f "${TS3_TEST_CONTAINER}" || true
