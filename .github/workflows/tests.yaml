name: Run pytest on push

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.dev.txt

      - name: Run ruff
        run: |
          ruff check .
          ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install -r requirements.dev.txt

      - name: Run ty
        run: |
          . .venv/bin/activate
          ty check --output-format=github .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TS3_TEST_CONTAINER: ts3-test-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.dev.txt

      - name: Run TeamSpeak 3 Docker Container
        run: |
          docker run -p 127.0.0.1:10022:10022 -p 9987:9987/udp -p 30033:30033 \
            -e TS3SERVER_LICENSE=accept \
            -e TS3SERVER_QUERY_PROTOCOLS=ssh \
            -e TS3SERVER_QUERY_SSH_PORT=10022 \
            -e TS3SERVER_SERVERADMIN_PASSWORD=IntegrationAdmin123 \
            --name "${TS3_TEST_CONTAINER}" -d teamspeak:3.13

      - name: Show Container Logs
        run: docker logs "${TS3_TEST_CONTAINER}"

      - name: Run pytest
        env:
          TS3_INTEGRATION: "1"
          TS3_QUERY_HOST: "127.0.0.1"
          TS3_QUERY_PORT: "10022"
          TS3_SERVER_PORT: "9987"
          QUERY_ADMIN_PASSWORD: "IntegrationAdmin123"
        run: |
          . .venv/bin/activate
          pytest -v

      - name: Clean up
        if: always()
        run: docker rm -f "${TS3_TEST_CONTAINER}" || true
