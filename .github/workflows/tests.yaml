name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.dev.txt

      - name: Run ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run ty
        run: ty check --output-format=github .

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.dev.txt

      - name: Run unit tests
        run: pytest -m "not integration" -q --durations=10

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit
    env:
      TS3_INTEGRATION: "1"
      TS3_MANAGE_CONTAINER: "1"
      TS3_TEST_IMAGE: "teamspeak:3.13.9"
      TS3_SERVER_PORT: "9987"
      QUERY_ADMIN_PASSWORD: "IntegrationAdmin123"
      JOBS: "4"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.dev.txt

      - name: Run integration tests
        run: pytest -m integration -n "$JOBS" -v --durations=10

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-logs
          path: |
            ts3-server-*.log
            logs/*.log
            logs/**/*.log
          if-no-files-found: ignore
          retention-days: 7
