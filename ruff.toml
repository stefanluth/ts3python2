target-version = "py314"
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["E501"]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"ts3client/constants/properties.py" = ["F401"]
"ts3client/constants/__init__.py" = ["F403", "F405"]
"ts3client/utils/validators.py" = ["F403", "F405"]
"ts3client/ts3query/ts3query_command.py" = ["F403", "F405"]
